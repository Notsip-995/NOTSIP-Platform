<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>NOTSIP Setup</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef}main{max-width:900px;margin:auto;padding:28px}.card{background:#141b2f;padding:20px;margin:14px 0;border-radius:14px}label{display:block;margin:10px 0 4px}input,select,textarea,button{font:inherit;border-radius:8px;border:1px solid #3b4669;background:#0e1528;color:#fff;padding:10px;box-sizing:border-box}input,select,textarea{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.ok{color:#7ee787}.bad{color:#ff7b72}.muted{color:#aab3cf;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>NOTSIP first-run setup</h1><p class='muted'>Configure the capabilities you intend to use. Secrets are written to the protected NOTSIP secret store; non-secret settings are stored as versioned configuration.</p><div class='card'><h2>Core</h2><div class='grid'><div><label>Host</label><input id='host' value='127.0.0.1'></div><div><label>Port</label><input id='port' value='8765' type='number'></div><div><label>Timezone</label><input id='tz' value='Africa/Kigali'></div><div><label>Autonomy level (0-4)</label><input id='autonomy' value='2' type='number' min='0' max='4'></div></div></div><div class='card'><h2>AI providers</h2><div class='grid'><div><label>Primary base URL</label><input id='llm_base'></div><div><label>Primary model</label><input id='llm_model'></div><div><label>Primary API key</label><input id='llm_key' type='password'></div><div><label>Fallback base URL</label><input id='fb_base'></div><div><label>Fallback model</label><input id='fb_model'></div><div><label>Fallback API key</label><input id='fb_key' type='password'></div></div></div><div class='card'><h2>Voice & vision</h2><div class='grid'><div><label>STT base URL</label><input id='stt_base'></div><div><label>STT model</label><input id='stt_model'></div><div><label>STT key</label><input id='stt_key' type='password'></div><div><label>TTS base URL</label><input id='tts_base'></div><div><label>TTS model</label><input id='tts_model'></div><div><label>TTS key</label><input id='tts_key' type='password'></div><div><label>Vision enabled</label><select id='vision'><option value='true'>Enabled</option><option value='false'>Disabled</option></select></div></div></div><div class='card'><h2>Web, mail & identity</h2><div class='grid'><div><label>Brave Search API key</label><input id='brave' type='password'></div><div><label>Email username</label><input id='email_user'></div><div><label>Email password / app password</label><input id='email_pass' type='password'></div><div><label>SMTP host</label><input id='smtp'></div><div><label>IMAP host</label><input id='imap'></div><div><label>OIDC provider</label><select id='oidc_provider'><option>generic</option><option>google</option><option>microsoft</option></select></div><div><label>OIDC client ID</label><input id='oidc_client'></div><div><label>OIDC client secret</label><input id='oidc_secret' type='password'></div></div></div><div class='card'><h2>Security & Android</h2><div class='grid'><div><label>API key (optional for local-only auth)</label><input id='api_key' type='password'></div><div><label>Event HMAC secret</label><input id='event_secret' type='password'></div><div><label>Pairing secret</label><input id='pair_secret' type='password'></div><div><label>Enable controlled self-maintenance</label><select id='selfmod'><option value='false'>Off</option><option value='true'>On</option></select></div></div></div><div class='actions'><button onclick='save()'>Save & test configuration</button><button onclick='location.href="/"'>Open NOTSIP</button></div><div id='result' class='card muted'></div><script>const ids=['host','port','tz','autonomy','llm_base','llm_model','llm_key','fb_base','fb_model','fb_key','stt_base','stt_model','stt_key','tts_base','tts_model','tts_key','vision','brave','email_user','email_pass','smtp','imap','oidc_provider','oidc_client','oidc_secret','api_key','event_secret','pair_secret','selfmod'];function payload(){const s={};for(const id of ids){const el=document.getElementById(id);s[({'host':'host','port':'port','tz':'local_timezone','autonomy':'autonomy_level','llm_base':'llm_base_url','llm_model':'llm_model','llm_key':'llm_api_key','fb_base':'fallback_llm_base_url','fb_model':'fallback_llm_model','fb_key':'fallback_llm_api_key','stt_base':'stt_base_url','stt_model':'stt_model','stt_key':'stt_api_key','tts_base':'tts_base_url','tts_model':'tts_model','tts_key':'tts_api_key','vision':'vision_enabled','brave':'brave_api_key','email_user':'email_username','email_pass':'email_password','smtp':'smtp_host','imap':'imap_host','oidc_provider':'oidc_provider','oidc_client':'oidc_client_id','oidc_secret':'oidc_client_secret','api_key':'api_key','event_secret':'event_hmac_secret','pair_secret':'pairing_secret','selfmod':'self_modify_enabled'})[id]]=id==='vision'||id==='selfmod'?el.value==='true':(['port','autonomy'].includes(id)?Number(el.value):el.value)}return s}async function save(){const r=document.getElementById('result');r.textContent='Saving…';try{const res=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings:payload()})});const d=await res.json();const diag=await fetch('/api/diagnostics').then(x=>x.json());r.innerHTML='<span class="ok">Saved.</span>\n'+JSON.stringify({config:d,diagnostics:diag},null,2)}catch(e){r.innerHTML='<span class="bad">'+e+'</span>'}};</script></main></body></html>
