<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>NOTSIP Setup</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef}main{max-width:980px;margin:auto;padding:28px}.card{background:#141b2f;padding:20px;margin:14px 0;border-radius:14px}label{display:block;margin:10px 0 4px}input,select,button{font:inherit;border-radius:8px;border:1px solid #3b4669;background:#0e1528;color:#fff;padding:10px;box-sizing:border-box}input,select{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.ok{color:#7ee787}.bad{color:#ff7b72}.muted{color:#aab3cf;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}progress{width:100%}</style></head><body><main><h1>NOTSIP first-run setup</h1><p class='muted'>Configure the capabilities you intend to use. Secrets are written to the protected NOTSIP secret store; non-secret settings are versioned. Save runs an immediate capability diagnostic.</p><div class='card'><h2>Core</h2><div class='grid'><div><label>Node name</label><input id='node_name' value='NOTSIP'></div><div><label>Host</label><input id='host' value='127.0.0.1'></div><div><label>Port</label><input id='port' value='8765' type='number'></div><div><label>Timezone</label><input id='tz' value='Africa/Kigali'></div><div><label>Autonomy level (0-4)</label><input id='autonomy' value='2' type='number' min='0' max='4'></div><div><label>Open browser automatically</label><select id='open_browser'><option value='true'>Yes</option><option value='false'>No</option></select></div><div><label>Health interval (seconds)</label><input id='health_interval' value='15' type='number'></div><div><label>Checkpoint interval (seconds)</label><input id='checkpoint_interval' value='300' type='number'></div><div><label>Proactive interval (seconds)</label><input id='proactive_interval' value='60' type='number'></div><div><label>Memory maintenance interval (seconds)</label><input id='memory_interval' value='900' type='number'></div></div></div><div class='card'><h2>AI providers</h2><div class='grid'><div><label>Primary base URL</label><input id='llm_base'></div><div><label>Primary model</label><input id='llm_model'></div><div><label>Primary API key</label><input id='llm_key' type='password'></div><div><label>Fallback base URL</label><input id='fb_base'></div><div><label>Fallback model</label><input id='fb_model'></div><div><label>Fallback API key</label><input id='fb_key' type='password'></div></div></div><div class='card'><h2>Voice & vision</h2><div class='grid'><div><label>Voice enabled</label><select id='voice_enabled'><option value='false'>No</option><option value='true'>Yes</option></select></div><div><label>Native Windows voice</label><select id='native_voice'><option value='false'>No</option><option value='true'>Yes</option></select></div><div><label>STT base URL</label><input id='stt_base'></div><div><label>STT model</label><input id='stt_model'></div><div><label>STT API key</label><input id='stt_key' type='password'></div><div><label>STT streaming URL</label><input id='stt_stream'></div><div><label>STT language</label><input id='stt_lang'></div><div><label>TTS base URL</label><input id='tts_base'></div><div><label>TTS model</label><input id='tts_model'></div><div><label>TTS API key</label><input id='tts_key' type='password'></div><div><label>TTS voice</label><input id='tts_voice' value='alloy'></div><div><label>Wake word (optional)</label><input id='wake_word'></div><div><label>VAD RMS threshold</label><input id='vad_threshold' value='700' type='number'></div><div><label>VAD silence blocks</label><input id='vad_silence' value='8' type='number'></div><div><label>Vision enabled</label><select id='vision'><option value='true'>Enabled</option><option value='false'>Disabled</option></select></div><div><label>Continuous perception</label><select id='perception'><option value='true'>Enabled</option><option value='false'>Disabled</option></select></div><div><label>Desktop screen perception</label><select id='screen_perception'><option value='false'>Disabled</option><option value='true'>Enabled</option></select></div><div><label>Perception interval (seconds)</label><input id='perception_interval' value='10' type='number'></div></div></div><div class='card'><h2>Web, mail & identity</h2><div class='grid'><div><label>Brave Search API key</label><input id='brave' type='password'></div><div><label>Email username</label><input id='email_user'></div><div><label>Email password / app password</label><input id='email_pass' type='password'></div><div><label>SMTP host</label><input id='smtp'></div><div><label>SMTP port</label><input id='smtp_port' value='587' type='number'></div><div><label>IMAP host</label><input id='imap'></div><div><label>OIDC provider</label><select id='oidc_provider'><option>generic</option><option>google</option><option>microsoft</option></select></div><div><label>OIDC issuer</label><input id='oidc_issuer'></div><div><label>OIDC client ID</label><input id='oidc_client'></div><div><label>OIDC client secret</label><input id='oidc_secret' type='password'></div><div><label>OIDC redirect URI</label><input id='oidc_redirect'></div><div><label>OIDC scopes</label><input id='oidc_scopes'></div></div></div><div class='card'><h2>Security, database & federation</h2><div class='grid'><div><label>Authentication mode</label><select id='auth_mode'><option>api_key</option><option>oidc</option></select></div><div><label>API key</label><input id='api_key' type='password'></div><div><label>Event HMAC secret</label><input id='event_secret' type='password'></div><div><label>Pairing secret</label><input id='pair_secret' type='password'></div><div><label>Federation shared secret</label><input id='node_secret' type='password'></div><div><label>Database URL</label><input id='database_url' value='sqlite:///data/notsip.db'></div><div><label>Automatic GitHub updates</label><select id='updates'><option value='true'>Enabled</option><option value='false'>Disabled</option></select></div><div><label>GitHub repository</label><input id='github_repo' value='Notsip-995/NOTSIP-Platform'></div><div><label>Log level</label><select id='log_level'><option>INFO</option><option>DEBUG</option><option>WARNING</option><option>ERROR</option></select></div><div><label>Controlled self-maintenance</label><select id='selfmod'><option value='false'>Off</option><option value='true'>On</option></select></div><div><label>Android polling seconds</label><input id='android_poll' value='3' type='number'></div><div><label>Node lease seconds</label><input id='lease' value='90' type='number'></div></div></div><div class='actions'><button onclick='save()'>Save & test configuration</button><button onclick='location.href="/"'>Open NOTSIP console</button></div><progress id='progress' hidden max='1' value='0'></progress><div id='result' class='card muted'></div><script>const map={node_name:'node_name',host:'host',port:'port',tz:'local_timezone',autonomy:'autonomy_level',open_browser:'open_browser',health_interval:'health_interval',checkpoint_interval:'checkpoint_interval',proactive_interval:'proactive_interval',memory_interval:'memory_maintenance_interval',llm_base:'llm_base_url',llm_model:'llm_model',llm_key:'llm_api_key',fb_base:'fallback_llm_base_url',fb_model:'fallback_llm_model',fb_key:'fallback_llm_api_key',voice_enabled:'voice_enabled',native_voice:'native_voice_enabled',stt_base:'stt_base_url',stt_model:'stt_model',stt_key:'stt_api_key',stt_stream:'stt_stream_url',stt_lang:'stt_language',tts_base:'tts_base_url',tts_model:'tts_model',tts_key:'tts_api_key',tts_voice:'tts_voice',wake_word:'wake_word',vad_threshold:'vad_rms_threshold',vad_silence:'vad_silence_blocks',vision:'vision_enabled',perception:'perception_enabled',screen_perception:'perception_screen_enabled',perception_interval:'perception_interval',brave:'brave_api_key',email_user:'email_username',email_pass:'email_password',smtp:'smtp_host',smtp_port:'smtp_port',imap:'imap_host',oidc_provider:'oidc_provider',oidc_issuer:'oidc_issuer',oidc_client:'oidc_client_id',oidc_secret:'oidc_client_secret',oidc_redirect:'oidc_redirect_uri',oidc_scopes:'oidc_scopes',auth_mode:'auth_mode',api_key:'api_key',event_secret:'event_hmac_secret',pair_secret:'pairing_secret',node_secret:'node_shared_secret',database_url:'database_url',updates:'github_update_enabled',github_repo:'github_repository',log_level:'log_level',selfmod:'self_modify_enabled',android_poll:'android_poll_seconds',lease:'node_lease_seconds'};const bools=new Set(['open_browser','voice_enabled','native_voice','vision','perception','screen_perception','updates','selfmod']);const nums=new Set(['port','autonomy','health_interval','checkpoint_interval','proactive_interval','memory_interval','vad_threshold','vad_silence','perception_interval','smtp_port','android_poll','lease']);function payload(){const s={};for(const [id,key] of Object.entries(map)){const el=document.getElementById(id);let v=el.value;if(bools.has(id))v=v==='true';else if(nums.has(id))v=Number(v);s[key]=v}return s}async function save(){const r=document.getElementById('result'),p=document.getElementById('progress');p.hidden=false;p.value=.25;r.textContent='Saving configuration…';try{const res=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings:payload()})});const d=await res.json();p.value=.75;if(!res.ok)throw Error(d.detail||JSON.stringify(d));r.innerHTML='<span class="ok">Configuration saved.</span>\n'+JSON.stringify({config:d,diagnostics:d.diagnostics},null,2);p.value=1}catch(e){r.innerHTML='<span class="bad">Setup failed: '+e.message+'</span>';p.value=0}};</script></main></body></html>
