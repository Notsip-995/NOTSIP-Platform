name: NOTSIP CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Docker build
        run: docker build -t notsip-ci .
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        shell: pwsh
        run: python -m pip install -e '.[windows]'
      - name: Build executable
        shell: pwsh
        run: .\scripts\build_exe.ps1
      - name: Smoke actual NOTSIP.exe end-to-end
        shell: pwsh
        env:
          NOTSIP_HOST: '127.0.0.1'
          NOTSIP_PORT: '8765'
          NOTSIP_API_KEY: ''
          NOTSIP_AUTH_MODE: 'api_key'
          NOTSIP_DATA_DIR: '${{ github.workspace }}\\ci-data'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:NOTSIP_DATA_DIR" | Out-Null
          $p = Start-Process -FilePath '.\dist\NOTSIP.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:NOTSIP_DATA_DIR\notsip.stdout.log" -RedirectStandardError "$env:NOTSIP_DATA_DIR\notsip.stderr.log"
          try {
            $ready = $false
            1..40 | ForEach-Object {
              if(-not $ready) {
                try {
                  $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 2
                  if($r.StatusCode -eq 200 -and $r.Content -match '<title>NOTSIP</title>' -and $r.Content -match 'Persistent AI operating layer') { $ready = $true }
                } catch {}
                if(-not $ready) { Start-Sleep -Milliseconds 500 }
              }
            }
            if(-not $ready) {
              Write-Host '--- NOTSIP stdout ---'
              if(Test-Path "$env:NOTSIP_DATA_DIR\notsip.stdout.log") { Get-Content "$env:NOTSIP_DATA_DIR\notsip.stdout.log" }
              Write-Host '--- NOTSIP stderr ---'
              if(Test-Path "$env:NOTSIP_DATA_DIR\notsip.stderr.log") { Get-Content "$env:NOTSIP_DATA_DIR\notsip.stderr.log" }
              throw 'NOTSIP.exe did not serve the packaged HTML UI'
            }

            $health = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/health' -UseBasicParsing -TimeoutSec 5
            if($health.StatusCode -ne 200 -or $health.Content -notmatch '"status":"ok"') { throw 'NOTSIP.exe health endpoint failed' }

            $status = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/status' -UseBasicParsing -TimeoutSec 5
            if($status.StatusCode -ne 200 -or $status.Content -notmatch '"identity":"NOTSIP"') { throw 'NOTSIP.exe status endpoint failed' }

            # A second launch must not crash because the configured port is
            # already occupied by a healthy NOTSIP instance.
            $p2 = Start-Process -FilePath '.\dist\NOTSIP.exe' -PassThru -WindowStyle Hidden -Wait
            if($p2.ExitCode -ne 0) { throw "Second NOTSIP.exe launch returned exit code $($p2.ExitCode)" }
            if($p.HasExited) { throw 'The first NOTSIP.exe instance exited unexpectedly' }
          }
          finally {
            if($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android assemble
        run: gradle -p android assembleDebug --no-daemon
