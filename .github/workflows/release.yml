name: NOTSIP release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows]" pyinstaller
      - name: Build NOTSIP.exe
        shell: pwsh
        run: .\scripts\build_exe.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build NOTSIP-Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\scripts\NOTSIP.iss'
      - name: Sign Windows release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_PUBLISHER_THUMBPRINT: ${{ secrets.WINDOWS_PUBLISHER_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PUBLISHER_THUMBPRINT)) { throw 'Tagged Windows releases require signing PFX, password and publisher thumbprint secrets.' }
          $expected = ($env:WINDOWS_PUBLISHER_THUMBPRINT -replace '\s','').ToUpperInvariant()
          $pfx = Join-Path $env:RUNNER_TEMP 'notsip-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner.' }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD /tr https://timestamp.digicert.com /td SHA256 dist\NOTSIP.exe Output\NOTSIP-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed with exit code $LASTEXITCODE" }
          foreach ($target in @('dist\NOTSIP.exe','Output\NOTSIP-Setup.exe')) {
            $sig = Get-AuthenticodeSignature $target
            if ($sig.Status -ne 'Valid') { throw "Authenticode verification failed for $target: $($sig.Status)" }
            $actual = (($sig.SignerCertificate.Thumbprint -replace '\s','').ToUpperInvariant())
            if ($actual -ne $expected) { throw "Authenticode publisher mismatch for $target: expected $expected, got $actual" }
          }
      - name: Generate Windows SHA-256 manifests
        shell: pwsh
        run: |
          (Get-FileHash dist\NOTSIP.exe -Algorithm SHA256).Hash.ToLower() + '  NOTSIP.exe' | Set-Content dist\NOTSIP.exe.sha256
          (Get-FileHash Output\NOTSIP-Setup.exe -Algorithm SHA256).Hash.ToLower() + '  NOTSIP-Setup.exe' | Set-Content Output\NOTSIP-Setup.exe.sha256
          if ((Get-FileHash dist\NOTSIP.exe -Algorithm SHA256).Hash.Length -ne 64) { throw 'Invalid Windows EXE digest.' }
          if ((Get-FileHash Output\NOTSIP-Setup.exe -Algorithm SHA256).Hash.Length -ne 64) { throw 'Invalid Windows installer digest.' }
      - name: Publish Windows assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NOTSIP.exe
            dist/NOTSIP.exe.sha256
            Output/NOTSIP-Setup.exe
            Output/NOTSIP-Setup.exe.sha256
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOTSIP-Windows
          path: |
            dist/NOTSIP.exe
            dist/NOTSIP.exe.sha256
            Output/NOTSIP-Setup.exe
            Output/NOTSIP-Setup.exe.sha256
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Require signing material for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -z "$value" ]; then echo 'Tagged Android releases require complete keystore/signing secrets.'; exit 1; fi
          done
      - name: Build Android artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            gradle -p android assembleRelease bundleRelease --no-daemon
          else
            gradle -p android assembleDebug --no-daemon
          fi
      - name: Require release artifacts for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
      - name: Verify Android release signatures
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/notsip-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
          expected=$(keytool -list -v -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          test -n "$expected"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          apk_fingerprint=$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk 2>&1 | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          test "$apk_fingerprint" = "$expected"
          jarsigner -verify -strict -verbose -certs android/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-signature.txt"
          grep -F "$expected" "$RUNNER_TEMP/aab-signature.txt" >/dev/null
      - name: Publish signed Android assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload Android release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: NOTSIP-Android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload development debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: NOTSIP-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
