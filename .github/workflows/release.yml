name: NOTSIP release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows]" pyinstaller
      - name: Build NOTSIP.exe
        shell: pwsh
        run: .\scripts\build_exe.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build NOTSIP-Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\scripts\NOTSIP.iss'
      - name: Publish Windows assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NOTSIP.exe
            Output/NOTSIP-Setup.exe
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOTSIP-Windows
          path: |
            dist/NOTSIP.exe
            Output/NOTSIP-Setup.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Build Android companion
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish Android artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOTSIP-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
