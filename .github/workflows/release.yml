name: NOTSIP release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows]" pyinstaller
      - name: Build NOTSIP.exe
        shell: pwsh
        run: .\scripts\build_exe.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build NOTSIP-Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\scripts\NOTSIP.iss'
      - name: Smoke frozen NOTSIP.exe release artifact
        shell: pwsh
        env:
          NOTSIP_HOST: '127.0.0.1'
          NOTSIP_PORT: '8765'
          NOTSIP_API_KEY: 'release-ci-test-key'
          NOTSIP_AUTH_MODE: 'api_key'
          NOTSIP_OPEN_BROWSER: 'false'
        run: |
          $ErrorActionPreference='Stop'
          $base='http://127.0.0.1:8765'
          $headers=@{Authorization="Bearer $env:NOTSIP_API_KEY"}
          $data=Join-Path $env:RUNNER_TEMP 'notsip-release-data'
          if(Test-Path $data){Remove-Item $data -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:NOTSIP_DATA_DIR=$data
          $p=Start-Process -FilePath '.\dist\NOTSIP.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput "$data\stdout.log" -RedirectStandardError "$data\stderr.log"
          try {
            $ready=$false
            1..40|ForEach-Object{if(-not $ready){try{$r=Invoke-WebRequest "$base/setup" -UseBasicParsing -TimeoutSec 2;if($r.StatusCode -eq 200 -and $r.Content -match 'NOTSIP first-run setup'){$ready=$true}}catch{};if(-not $ready){Start-Sleep -Milliseconds 500}}}
            if(-not $ready){throw 'frozen NOTSIP.exe did not expose setup UI'}
            $body='{"settings":{"local_timezone":"Africa/Kigali","autonomy_level":1,"vision_enabled":false,"perception_enabled":false,"browser_enabled":false,"checkpoint_interval":60,"health_interval":5,"proactive_interval":30,"memory_maintenance_interval":120}}'
            $cfg=Invoke-WebRequest -Uri "$base/api/config" -Method POST -ContentType 'application/json' -Body $body -UseBasicParsing -TimeoutSec 5
            if($cfg.StatusCode -ne 200 -or $cfg.Content -notmatch '"status":"SUCCESS"'){throw 'frozen artifact configuration failed'}
            $state=Invoke-WebRequest "$base/api/config/public" -Headers $headers -UseBasicParsing -TimeoutSec 5
            if($state.StatusCode -ne 200 -or $state.Content -notmatch '"autonomy_level":1'){throw 'frozen artifact configuration did not persist'}
            Stop-Process -Id $p.Id -Force; $p.WaitForExit(); Start-Sleep -Milliseconds 500
            $p=Start-Process -FilePath '.\dist\NOTSIP.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput "$data\restart.stdout.log" -RedirectStandardError "$data\restart.stderr.log"
            $ready=$false
            1..40|ForEach-Object{if(-not $ready){try{$r=Invoke-WebRequest "$base/api/health" -Headers $headers -UseBasicParsing -TimeoutSec 2;if($r.StatusCode -eq 200){$ready=$true}}catch{};if(-not $ready){Start-Sleep -Milliseconds 500}}}
            if(-not $ready){throw 'frozen artifact did not restart'}
            $persisted=Invoke-WebRequest "$base/api/config/public" -Headers $headers -UseBasicParsing -TimeoutSec 5
            if($persisted.Content -notmatch '"autonomy_level":1'){throw 'frozen artifact lost configuration after restart'}
            $dup=Start-Process -FilePath '.\dist\NOTSIP.exe' -PassThru -WindowStyle Hidden
            1..20|ForEach-Object{if(-not $dup.HasExited){Start-Sleep -Milliseconds 500}}
            if(-not $dup.HasExited){Stop-Process -Id $dup.Id -Force;throw 'duplicate frozen instance remained running'}
            if($dup.ExitCode -ne 0){throw "duplicate frozen launch returned $($dup.ExitCode)"}
            $live=Invoke-WebRequest "$base/api/health" -Headers $headers -UseBasicParsing -TimeoutSec 5
            if($live.StatusCode -ne 200){throw 'existing frozen service was not left healthy'}
          } finally {if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force}}
          Get-Process -Name 'NOTSIP' -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 1000
      - name: Smoke signed installer release artifact
        shell: pwsh
        env:
          NOTSIP_HOST: '127.0.0.1'
          NOTSIP_PORT: '8776'
          NOTSIP_API_KEY: 'release-ci-test-key'
          NOTSIP_AUTH_MODE: 'api_key'
          NOTSIP_OPEN_BROWSER: 'false'
        run: |
          $ErrorActionPreference='Stop'
          $installDir=Join-Path $env:RUNNER_TEMP 'NOTSIP-release-installed'
          if(Test-Path $installDir){Remove-Item $installDir -Recurse -Force}
          Start-Process -FilePath '.\Output\NOTSIP-Setup.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir" -Wait
          if(-not(Test-Path "$installDir\NOTSIP.exe")){throw 'release installer did not produce NOTSIP.exe'}
          $env:NOTSIP_DATA_DIR=Join-Path $installDir 'data'
          New-Item -ItemType Directory -Force -Path $env:NOTSIP_DATA_DIR | Out-Null
          $base='http://127.0.0.1:8776';$headers=@{Authorization="Bearer $env:NOTSIP_API_KEY"}
          $p=Start-Process -FilePath "$installDir\NOTSIP.exe" -PassThru -WindowStyle Hidden
          try {
            $ready=$false
            1..40|ForEach-Object{if(-not $ready){try{$r=Invoke-WebRequest "$base/setup" -UseBasicParsing -TimeoutSec 2;if($r.StatusCode -eq 200){$ready=$true}}catch{};if(-not $ready){Start-Sleep -Milliseconds 500}}}
            if(-not $ready){throw 'installed release copy did not start'}
            $body='{"settings":{"local_timezone":"Africa/Kigali","autonomy_level":1,"vision_enabled":false,"perception_enabled":false,"browser_enabled":false}}'
            $cfg=Invoke-WebRequest -Uri "$base/api/config" -Method POST -ContentType 'application/json' -Body $body -UseBasicParsing -TimeoutSec 5
            if($cfg.StatusCode -ne 200 -or $cfg.Content -notmatch '"status":"SUCCESS"'){throw 'installed release configuration failed'}
            $live=Invoke-WebRequest "$base/api/health" -Headers $headers -UseBasicParsing -TimeoutSec 5
            if($live.StatusCode -ne 200){throw 'installed release health failed'}
          } finally {if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force}}
          $uninstaller=Join-Path $installDir 'unins000.exe'
          if(-not(Test-Path $uninstaller)){throw 'release uninstaller missing'}
          # Give the installed NOTSIP process time to exit before uninstalling:
          # a lingering process locks NOTSIP.exe and makes Inno deliberately
          # leave the file behind so the post-uninstall check is reliable.
          1..10|ForEach-Object{Get-Process -Name 'NOTSIP' -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue;Start-Sleep -Milliseconds 500}
          Start-Sleep -Milliseconds 1000
          Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES' -Wait
          1..10|ForEach-Object{if(Test-Path "$installDir\NOTSIP.exe"){Start-Sleep -Milliseconds 500}}
          if(Test-Path "$installDir\NOTSIP.exe"){throw 'release uninstall did not remove NOTSIP.exe'}
      - name: Sign Windows release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_PUBLISHER_THUMBPRINT: ${{ secrets.WINDOWS_PUBLISHER_THUMBPRINT }}
        run: |
          $hasMaterial = [bool]($env:WINDOWS_SIGNING_PFX_BASE64 -and $env:WINDOWS_SIGNING_PFX_PASSWORD -and $env:WINDOWS_PUBLISHER_THUMBPRINT)
          if (-not $hasMaterial) {
            Write-Host 'No Windows code-signing material configured; publishing unsigned binaries with SHA-256 manifests. Configure WINDOWS_SIGNING_PFX_BASE64, WINDOWS_SIGNING_PFX_PASSWORD and WINDOWS_PUBLISHER_THUMBPRINT to sign release EXEs.'
            Write-Host '::warning::NOTSIP release EXEs were not Authenticode-signed (no signing material configured).'
            exit 0
          }
          $expected = ($env:WINDOWS_PUBLISHER_THUMBPRINT -replace '\s','').ToUpperInvariant()
          $pfx = Join-Path $env:RUNNER_TEMP 'notsip-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner.' }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD /tr https://timestamp.digicert.com /td SHA256 dist\NOTSIP.exe Output\NOTSIP-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed with exit code $LASTEXITCODE" }
          foreach ($target in @('dist\NOTSIP.exe','Output\NOTSIP-Setup.exe')) {
            $sig = Get-AuthenticodeSignature $target
            if ($sig.Status -ne 'Valid') { throw "Authenticode verification failed for ${target}: $($sig.Status)" }
            $actual = (($sig.SignerCertificate.Thumbprint -replace '\s','').ToUpperInvariant())
            if ($actual -ne $expected) { throw "Authenticode publisher mismatch for ${target}: expected $expected, got $actual" }
          }
      - name: Generate Windows SHA-256 manifests
        shell: pwsh
        run: |
          (Get-FileHash dist\NOTSIP.exe -Algorithm SHA256).Hash.ToLower() + '  NOTSIP.exe' | Set-Content dist\NOTSIP.exe.sha256
          (Get-FileHash Output\NOTSIP-Setup.exe -Algorithm SHA256).Hash.ToLower() + '  NOTSIP-Setup.exe' | Set-Content Output\NOTSIP-Setup.exe.sha256
          if ((Get-FileHash dist\NOTSIP.exe -Algorithm SHA256).Hash.Length -ne 64) { throw 'Invalid Windows EXE digest.' }
          if ((Get-FileHash Output\NOTSIP-Setup.exe -Algorithm SHA256).Hash.Length -ne 64) { throw 'Invalid Windows installer digest.' }
      - name: Publish Windows assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NOTSIP.exe
            dist/NOTSIP.exe.sha256
            Output/NOTSIP-Setup.exe
            Output/NOTSIP-Setup.exe.sha256
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOTSIP-Windows
          path: |
            dist/NOTSIP.exe
            dist/NOTSIP.exe.sha256
            Output/NOTSIP-Setup.exe
            Output/NOTSIP-Setup.exe.sha256
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Require signing material for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Tagged Android releases require the complete keystore/signing
          # secrets; failing fast leaves the strict signing contract intact.
          # Because the Windows release job is a separate workflow job, a
          # missing Android keystore fails only the Android job and does not
          # prevent Windows NOTSIP.exe / NOTSIP-Setup.exe from publishing.
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -z "$value" ]; then echo 'Tagged Android releases require complete keystore/signing secrets.'; exit 1; fi
          done
      - name: Build Android artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            gradle -p android assembleRelease bundleRelease --no-daemon
          else
            gradle -p android assembleDebug --no-daemon
          fi
      - name: Require release artifacts for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
      - name: Verify Android release signatures
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/notsip-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
          expected=$(keytool -list -v -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          test -n "$expected"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          apk_fingerprint=$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk 2>&1 | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          test "$apk_fingerprint" = "$expected"
          jarsigner -verify -strict -verbose -certs android/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-signature.txt"
          grep -F "$expected" "$RUNNER_TEMP/aab-signature.txt" >/dev/null
      - name: Publish signed Android assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload Android release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: NOTSIP-Android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload development debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: NOTSIP-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
