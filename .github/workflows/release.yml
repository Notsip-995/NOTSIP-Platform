name: NOTSIP Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows]"
          python -m pip install pyinstaller
      - name: Build NOTSIP.exe
        shell: pwsh
        run: .\scripts\build_exe.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build NOTSIP installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\scripts\NOTSIP.iss'
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NOTSIP.exe
            Output/NOTSIP-Setup.exe
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOTSIP-Windows-release
          path: |
            dist/NOTSIP.exe
            Output/NOTSIP-Setup.exe
