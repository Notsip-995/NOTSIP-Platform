[project]
name='notsip'
version='0.9.0'
description='NOTSIP persistent AI operating layer'
requires-python='>=3.12'
dependencies=['fastapi>=0.115,<1','uvicorn[standard]>=0.34,<1','pydantic>=2.9,<3','pydantic-settings>=2.6,<3','httpx>=0.28,<1','cryptography>=44,<46','playwright>=1.55,<2','python-multipart>=0.0.20,<1','PyJWT[crypto]>=2.10,<3']
[project.optional-dependencies]
windows=['pywinauto>=0.6.9,<1','pyperclip>=1.9,<2']
dev=['pytest>=8.3,<9','pytest-asyncio>=0.25,<1']
[project.scripts]
notsip='notsip.__main__:main'
[build-system]
requires=['hatchling']
build-backend='hatchling.build'
[tool.pytest.ini_options]
pythonpath=['src']
