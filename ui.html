<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOTSIP</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#eef}main{max-width:1100px;margin:auto;padding:24px}section{background:#141b2f;border:1px solid #29324f;border-radius:14px;padding:16px;margin:12px 0}button,input,textarea{font:inherit;border-radius:8px;border:1px solid #3b4669;background:#0e1528;color:#fff;padding:10px}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}textarea{width:100%;min-height:90px}.status{white-space:pre-wrap;background:#0a0f1d;padding:12px;border-radius:8px}.chat{max-height:340px;overflow:auto}.msg{padding:8px;margin:6px 0;border-radius:8px;background:#1b2540}.user{background:#243458}video{max-width:100%;width:420px;border-radius:10px}</style></head><body><main><h1>NOTSIP</h1><p>Persistent AI operating layer</p><section><h2>Connection</h2><div class="row"><input id="key" type="password" placeholder="API key (optional)"><button onclick="saveKey()">Save key</button><button onclick="login()">OIDC Login</button><button onclick="refreshStatus()">Refresh</button></div><div id="status" class="status">Loading…</div></section><section><h2>Chat</h2><div id="chat" class="chat"></div><textarea id="prompt" placeholder="Talk to NOTSIP…"></textarea><div class="row"><button onclick="send()">Send</button><button id="micBtn" onclick="toggleMic()">🎙 Start voice</button><button onclick="speakLast()">🔊 Speak answer</button></div></section><section><h2>Perception</h2><div class="row"><button onclick="startCamera()">Start camera</button><button onclick="captureFrame()">Capture & analyze</button><button onclick="stopCamera()">Stop camera</button></div><video id="cam" autoplay playsinline></video><div id="vision" class="status"></div></section></main><script>let key=localStorage.getItem('notsip_key')||'';document.getElementById('key').value=key;let recorder=null,chunks=[],lastText='',stream=null;function hdr(){return key?{'Authorization':'Bearer '+key}:{} }function saveKey(){key=document.getElementById('key').value;localStorage.setItem('notsip_key',key);refreshStatus()}async function api(path,opt={}){opt.headers={...(opt.headers||{}),...hdr()};let r=await fetch(path,opt);if(!r.ok)throw Error(await r.text());return r}async function refreshStatus(){try{let d=await api('/api/status').then(r=>r.json());document.getElementById('status').textContent=JSON.stringify(d,null,2)}catch(e){document.getElementById('status').textContent='Error: '+e.message}}function login(){location.href='/api/oauth/login'}function add(role,text){let d=document.createElement('div');d.className='msg '+(role==='user'?'user':'');d.textContent=(role==='user'?'You: ':'NOTSIP: ')+text;document.getElementById('chat').appendChild(d)}async function send(text){text=text??document.getElementById('prompt').value.trim();if(!text)return;add('user',text);document.getElementById('prompt').value='';try{let d=await api('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})}).then(r=>r.json());lastText=d.response||'';add('assistant',lastText)}catch(e){add('assistant','Error: '+e.message)}}async function toggleMic(){if(recorder){recorder.stop();recorder=null;document.getElementById('micBtn').textContent='🎙 Start voice';return}stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream,{mimeType:'audio/webm'});chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=async()=>{let fd=new FormData();fd.append('file',new File([new Blob(chunks,{type:'audio/webm'})],'voice.webm',{type:'audio/webm'}));try{let d=await api('/api/voice/transcribe',{method:'POST',body:fd}).then(r=>r.json());if(d.text)await send(d.text)}catch(e){add('assistant','Voice error: '+e.message)}stream.getTracks().forEach(t=>t.stop())};recorder.start();document.getElementById('micBtn').textContent='⏹ Stop voice'}async function speakLast(){if(!lastText)return;try{let d=await api('/api/voice/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:lastText})}).then(r=>r.json());new Audio('/api/voice/audio/'+d.path.split('/').map(encodeURIComponent).join('/')).play()}catch(e){speechSynthesis.speak(new SpeechSynthesisUtterance(lastText))}}async function startCamera(){stream=await navigator.mediaDevices.getUserMedia({video:true});document.getElementById('cam').srcObject=stream}function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}async function captureFrame(){let v=document.getElementById('cam');if(!v.videoWidth)return;let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let b64=c.toDataURL('image/jpeg',.8).split(',')[1];try{let d=await api('/api/perception/frame',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_base64:b64,mime:'image/jpeg'})}).then(r=>r.json());document.getElementById('vision').textContent=JSON.stringify(d,null,2)}catch(e){document.getElementById('vision').textContent='Vision error: '+e.message}}refreshStatus();</script></body></html>
