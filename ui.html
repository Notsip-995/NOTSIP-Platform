<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOTSIP</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b0e12;color:#eef}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.pill{border:1px solid #39434f;border-radius:99px;padding:6px 10px;font-size:12px}.chat{min-height:55vh;border:1px solid #26303a;border-radius:16px;padding:18px;margin:18px 0;background:#11161d}.msg{padding:12px 14px;margin:10px 0;border-radius:12px;white-space:pre-wrap}.u{background:#17212b}.a{background:#151d18}.bar{display:flex;gap:8px}.bar input{flex:1}.bar input,.bar button{padding:13px;border-radius:12px;border:1px solid #37414d;background:#10161c;color:#fff}.bar button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{border:1px solid #27313a;border-radius:12px;padding:10px}.muted{opacity:.7;font-size:.9em}</style></head><body><div class="wrap"><div class="top"><div><h1>NOTSIP</h1><div class="muted">Persistent AI operating layer</div></div><div id="status" class="pill">loading</div></div><div class="cards" id="cards"></div><div class="chat" id="chat"></div><div class="bar"><input id="input" placeholder="Talk to NOTSIP…"><button id="mic">🎙</button><button id="send">Send</button></div></div><script>
const input=document.getElementById('input'),chat=document.getElementById('chat');
function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
async function api(path,opts={}){const r=await fetch(path,opts);if(!r.ok)throw new Error(await r.text());return r.json()}
async function boot(){try{const s=await api('/api/status');const d=await api('/api/degraded');document.getElementById('status').textContent=d.degraded?'DEGRADED':'ONLINE';document.getElementById('cards').innerHTML=`<div class=card>Tools ${s.tools.length}</div><div class=card>Autonomy ${s.autonomy_level}</div><div class=card>Devices ${s.devices.length}</div><div class=card>Entities ${s.world.entities.length}</div>`;add('a',d.degraded?'NOTSIP is online with missing configured capabilities: '+d.reasons.join(', '):'NOTSIP is online.')}catch(e){document.getElementById('status').textContent='OFFLINE';add('a','Startup check failed: '+e)}}
async function send(){const t=input.value.trim();if(!t)return;add('u',t);input.value='';try{const j=await api('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});add('a',j.response||j.error||JSON.stringify(j));if(window.speechSynthesis&&j.response){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(j.response));}}catch(e){add('a','Request failed: '+e)}}
document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){document.getElementById('mic').onclick=()=>{const r=new SR();r.lang='en-US';r.interimResults=false;r.onresult=e=>{input.value=e.results[0][0].transcript;send()};r.start()}}else document.getElementById('mic').disabled=true;boot();
</script></body></html>
