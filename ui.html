<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>NOTSIP Console</title><style>body{font-family:system-ui;margin:0;background:#09111f;color:#eef}nav{position:sticky;top:0;background:#101a2f;padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#111c31;border:1px solid #263858;border-radius:14px;padding:16px}.mono{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px;max-height:320px;overflow:auto}button,input,textarea{font:inherit;border-radius:8px;border:1px solid #33496e;background:#0d1728;color:#fff;padding:10px}button{cursor:pointer}textarea{width:100%;min-height:90px;box-sizing:border-box}.good{color:#7ee787}.bad{color:#ff7b72}.muted{color:#a8b4ca}.chat{height:280px;overflow:auto}.msg{padding:8px;margin:5px 0;border-radius:8px;background:#17243d}.you{background:#22385e}</style></head><body><nav><b>NOTSIP</b><button onclick='show("dashboard")'>Dashboard</button><button onclick='show("memory")'>Memory</button><button onclick='show("tasks")'>Tasks</button><button onclick='show("devices")'>Devices</button><button onclick='show("security")'>Security</button><button onclick='show("diagnostics")'>Diagnostics</button><button onclick='show("backup")'>Backup</button><button onclick='location.href="/setup"'>Setup</button></nav><main><section id='dashboard' class='view'><div class='grid'><div class='card'><h2>Status</h2><div id='status' class='mono'>Loading…</div></div><div class='card'><h2>Capabilities</h2><div id='caps' class='mono'>Loading…</div></div><div class='card'><h2>Degraded mode</h2><div id='degraded' class='mono'>Loading…</div></div></div><div class='card'><h2>Chat</h2><div id='chat' class='chat'></div><textarea id='prompt' placeholder='Talk to NOTSIP…'></textarea><button onclick='send()'>Send</button><button onclick='voice()'>🎙 Voice</button></div></section><section id='memory' class='view' hidden><div class='card'><h2>Memory</h2><button onclick='loadMemory()'>Refresh</button><div id='memoryOut' class='mono'></div></div></section><section id='tasks' class='view' hidden><div class='card'><h2>Tasks</h2><div><input id='taskObjective' placeholder='Objective'><button onclick='createTask()'>Schedule</button></div><div id='tasksOut' class='mono'></div></div></section><section id='devices' class='view' hidden><div class='card'><h2>Android / nodes</h2><div id='devicesOut' class='mono'></div></div></section><section id='security' class='view' hidden><div class='card'><h2>Approvals</h2><div id='approvalsOut' class='mono'></div><h2>Self-awareness</h2><button onclick='inspect()'>Inspect codebase</button><div id='inspectOut' class='mono'></div></div></section><section id='diagnostics' class='view' hidden><div class='card'><h2>Diagnostics</h2><button onclick='diag()'>Run full diagnostics</button><div id='diagOut' class='mono'></div></div></section><section id='backup' class='view' hidden><div class='card'><h2>Backup & recovery</h2><button onclick='backup()'>Create backup</button><button onclick='backups()'>List backups</button><div id='backupOut' class='mono'></div></div></section><script>let mediaRecorder=null,audioChunks=[];async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':opt.body?'application/json':undefined,...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r}function show(id){document.querySelectorAll('.view').forEach(x=>x.hidden=true);document.getElementById(id).hidden=false;if(id==='memory')loadMemory();if(id==='tasks')loadTasks();if(id==='devices')loadDevices();if(id==='security')loadApprovals();if(id==='diagnostics')diag();}async function refresh(){try{status.textContent=JSON.stringify(await api('/api/status').then(r=>r.json()),null,2);caps.textContent=JSON.stringify(await api('/api/capabilities').then(r=>r.json()),null,2);degraded.textContent=JSON.stringify(await api('/api/degraded').then(r=>r.json()),null,2)}catch(e){status.textContent='ERROR '+e.message}}function add(who,text){const d=document.createElement('div');d.className='msg '+(who==='You'?'you':'');d.textContent=who+': '+text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function send(text){text=text??prompt.value.trim();if(!text)return;add('You',text);prompt.value='';try{const d=await api('/api/message',{method:'POST',body:JSON.stringify({message:text})}).then(r=>r.json());add('NOTSIP',d.response||JSON.stringify(d))}catch(e){add('NOTSIP','ERROR '+e.message)}}async function voice(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(s,{mimeType:'audio/webm'});audioChunks=[];mediaRecorder.ondataavailable=e=>e.data.size&&audioChunks.push(e.data);mediaRecorder.onstop=async()=>{const fd=new FormData();fd.append('file',new File([new Blob(audioChunks,{type:'audio/webm'})],'voice.webm',{type:'audio/webm'}));const d=await api('/api/voice/transcribe',{method:'POST',headers:{},body:fd}).then(r=>r.json());if(d.text)send(d.text);s.getTracks().forEach(t=>t.stop())};mediaRecorder.start();setTimeout(()=>mediaRecorder&&mediaRecorder.stop(),5000)}catch(e){add('NOTSIP','Voice unavailable: '+e.message)}}async function loadMemory(){memoryOut.textContent=JSON.stringify(await api('/api/memory').then(r=>r.json()),null,2)}async function loadTasks(){tasksOut.textContent=JSON.stringify(await api('/api/tasks').then(r=>r.json()),null,2)}async function createTask(){const o=taskObjective.value.trim();if(!o)return;await api('/api/tasks',{method:'POST',body:JSON.stringify({objective:o,handler:'agent'})});taskObjective.value='';loadTasks()}async function loadDevices(){devicesOut.textContent=JSON.stringify(await api('/api/devices').then(r=>r.json()),null,2)}async function loadApprovals(){approvalsOut.textContent=JSON.stringify(await api('/api/approvals').then(r=>r.json()),null,2)}async function inspect(){inspectOut.textContent=JSON.stringify(await api('/api/self/provenance').then(r=>r.json()),null,2)}async function diag(){diagOut.textContent=JSON.stringify(await api('/api/diagnostics').then(r=>r.json()),null,2)}async function backup(){backupOut.textContent=JSON.stringify(await api('/api/backups',{method:'POST'}).then(r=>r.json()),null,2)}async function backups(){backupOut.textContent=JSON.stringify(await api('/api/backups').then(r=>r.json()),null,2)}refresh();setInterval(refresh,15000)</script></main></body></html>
